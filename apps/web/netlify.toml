# Netlify reads this file because the site's Package directory is set to
# "apps/web" in the UI. Base directory is deliberately left at the repo root so
# pnpm installs the whole workspace and workspace deps resolve.
#
# Every path below is relative to the BASE directory (the repo root), not to
# this file. That is a Netlify rule and the usual source of monorepo breakage.

[[redirects]]
  from = "/stats.js"
  to = "https://cloud.umami.is/script.js"
  status = 200

[[redirects]]
  from = "/tools"
  to = "/tools/ics-generator"
  status = 302

[[redirects]]
  from = "/tools/*"
  to = "https://luhive-tools.netlify.app/:splat"
  status = 200
  force = true

[build]
  command = "pnpm --filter @luhive/web build"
  publish = "apps/web/build/client"
  edge_functions = "apps/web/netlify/edge-functions"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "apps/web/build/client,apps/web/build/server"
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL,SUPABASE_ANON_KEY,VITE_GOOGLE_MAPS_API_KEY"
