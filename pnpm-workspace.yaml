packages:
  - "packages/*"
  - "apps/*"

# One version workspace-wide. Version skew across package boundaries breaks type
# assignability, and the resulting error never says that is the cause.
# zod and @supabase/supabase-js match apps/web's current specifiers, so adopting
# `catalog:` there resolves to what it already has.
catalog:
  zod: ^4.1.12
  hono: ^4
  "@supabase/supabase-js": ^2.75.0
  drizzle-orm: ^0.44

# @hookform/resolvers/zod imports `zod/v4/core` but declares no zod peer, so it
# only resolves when zod happens to be hoisted above it. Moving the app into
# apps/web changed that hoisting and broke the Netlify build. Declaring the peer
# links zod into the package directly, independent of layout.
packageExtensions:
  "@hookform/resolvers":
    peerDependencies:
      zod: "*"
    peerDependenciesMeta:
      zod:
        optional: true

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - supabase
  - workerd
